<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Início | GenSaúde SUS</title>


    <!-- =========================================
         CSS DA TELA
    ========================================== -->

    <link
        rel="stylesheet"
        href="inicio_logado.css"
    >


    <!-- =========================================
         COMPONENTES GLOBAIS
    ========================================== -->

    <link
        rel="stylesheet"
        href="../componentes/header.css"
    >

    <link
        rel="stylesheet"
        href="../componentes/disclaimer.css"
    >

</head>


<body>


    <!-- =========================================
         HEADER GLOBAL
    ========================================== -->

    <div
        id="global-header"
        data-active="inicio"
    ></div>



    <!-- =========================================
         CONTEÚDO PRINCIPAL
    ========================================== -->

    <main class="main-content">


        <!-- =========================================
             SAUDAÇÃO
        ========================================== -->

        <section class="welcome-section">

            <h1>

                Olá,

                <span id="firstName">
                    Usuário
                </span>

                <span class="wave">
                    👋
                </span>

            </h1>


            <p>
                Cuide hoje para prevenir problemas amanhã.
            </p>

        </section>



        <!-- =========================================
             AVALIAÇÃO PREVENTIVA
        ========================================== -->

        <section class="preventive-banner">


            <div class="preventive-content">

                <h2>
                    Avaliação Preventiva
                </h2>


                <p>
                    Descubra seus fatores de risco
                    <br>
                    com base no histórico familiar.
                </p>


                <button
                    type="button"
                    class="assessment-button"
                    id="assessmentButton"
                >

                    <img
                        src="../imagens/planilha.png"
                        alt=""
                        class="assessment-icon"
                        onerror="this.style.visibility='hidden'"
                    >

                    <span>
                        Iniciar avaliação
                    </span>

                </button>

            </div>



            <!-- =====================================
                 ILUSTRAÇÃO
            ====================================== -->

            <div class="preventive-image-area">

                <img
                    src="../imagens/ilustracao_inicio.png"
                    alt="Avaliação preventiva"
                    class="preventive-image"
                    onerror="this.style.visibility='hidden'"
                >

            </div>

        </section>



        <!-- =========================================
             ACESSO RÁPIDO
        ========================================== -->

        <section class="quick-access-section">


            <h2 class="section-title">
                Acesso rápido
            </h2>


            <div class="quick-access-grid">



                <!-- =================================
                     HISTÓRICO FAMILIAR
                ================================== -->

                <button
                    type="button"
                    class="quick-card"
                    id="historyCard"
                >

                    <img
                        src="../imagens/historico_familiar.png"
                        alt=""
                        class="quick-card-image"
                        onerror="this.style.visibility='hidden'"
                    >


                    <div class="quick-card-content">

                        <h3>
                            Meu Histórico
                            <br>
                            Familiar
                        </h3>


                        <p>
                            Veja e atualize seu
                            <br>
                            histórico familiar.
                        </p>

                    </div>


                    <img
                        src="../imagens/seta.png"
                        alt=""
                        class="arrow-icon"
                        onerror="this.style.visibility='hidden'"
                    >

                </button>



                <!-- =================================
                     UBS OU UPA
                ================================== -->

                <button
                    type="button"
                    class="quick-card"
                    id="ubsCard"
                >

                    <img
                        src="../imagens/ubsouupa.png"
                        alt=""
                        class="quick-card-image"
                        onerror="this.style.visibility='hidden'"
                    >


                    <div class="quick-card-content">

                        <h3>
                            UBS ou UPA?
                        </h3>


                        <p>
                            Saiba onde
                            <br>
                            procurar conforme
                            <br>
                            seu caso.
                        </p>

                    </div>


                    <img
                        src="../imagens/seta.png"
                        alt=""
                        class="arrow-icon"
                        onerror="this.style.visibility='hidden'"
                    >

                </button>



                <!-- =================================
                     UNIDADES PRÓXIMAS
                ================================== -->

                <button
                    type="button"
                    class="quick-card"
                    id="unitsCard"
                >

                    <img
                        src="../imagens/unidades_proximas.png"
                        alt=""
                        class="quick-card-image"
                        onerror="this.style.visibility='hidden'"
                    >


                    <div class="quick-card-content">

                        <h3>
                            Unidades
                            <br>
                            Próximas
                        </h3>


                        <p>
                            Encontre unidades
                            <br>
                            perto de você.
                        </p>

                    </div>


                    <img
                        src="../imagens/seta.png"
                        alt=""
                        class="arrow-icon"
                        onerror="this.style.visibility='hidden'"
                    >

                </button>



                <!-- =================================
                     EDUCAÇÃO EM SAÚDE
                ================================== -->

                <button
                    type="button"
                    class="quick-card"
                    id="educationCard"
                >

                    <img
                        src="../imagens/educacao_em_saude.png"
                        alt=""
                        class="quick-card-image"
                        onerror="this.style.visibility='hidden'"
                    >


                    <div class="quick-card-content">

                        <h3>
                            Educação em
                            <br>
                            Saúde
                        </h3>


                        <p>
                            Conteúdo para
                            <br>
                            cuidar melhor da
                            <br>
                            saúde.
                        </p>

                    </div>


                    <img
                        src="../imagens/seta.png"
                        alt=""
                        class="arrow-icon"
                        onerror="this.style.visibility='hidden'"
                    >

                </button>


            </div>

        </section>



        <!-- =========================================
             ACOMPANHAMENTO
        ========================================== -->

        <section class="tracking-section">


            <h2 class="section-title">
                Seu acompanhamento
            </h2>


            <div class="tracking-grid">



                <!-- =================================
                     ÚLTIMA AVALIAÇÃO
                ================================== -->

                <button
                    type="button"
                    class="tracking-card"
                    id="lastAssessmentCard"
                >

                    <img
                        src="../imagens/atencao_recomendada.png"
                        alt=""
                        class="tracking-image"
                        onerror="this.style.visibility='hidden'"
                    >


                    <div class="tracking-content">

                        <span class="tracking-label">
                            Última avaliação
                        </span>


                        <strong class="tracking-danger">
                            Atenção Recomendada
                        </strong>


                        <span class="tracking-detail">
                            Realizada em 15/04/2026
                        </span>

                    </div>


                    <img
                        src="../imagens/seta.png"
                        alt=""
                        class="tracking-arrow"
                        onerror="this.style.visibility='hidden'"
                    >

                </button>



                <!-- =================================
                     UBS DE REFERÊNCIA
                ================================== -->

                <button
                    type="button"
                    class="tracking-card"
                    id="referenceUnitCard"
                >

                    <img
                        src="../imagens/ubs.png"
                        alt=""
                        class="tracking-image"
                        onerror="this.style.visibility='hidden'"
                    >


                    <div class="tracking-content">

                        <span class="tracking-label">
                            UBS de referência
                        </span>


                        <strong class="tracking-primary">
                            UBS Jardim das Flores
                        </strong>


                        <span class="tracking-detail">
                            Rua das Flores, 320 - Jardim das Flores
                        </span>

                    </div>


                    <img
                        src="../imagens/seta.png"
                        alt=""
                        class="tracking-arrow"
                        onerror="this.style.visibility='hidden'"
                    >

                </button>



                <!-- =================================
                     PRÓXIMA AÇÃO
                ================================== -->

                <button
                    type="button"
                    class="tracking-card"
                    id="nextActionCard"
                >

                    <img
                        src="../imagens/calendario2.png"
                        alt=""
                        class="tracking-image"
                        onerror="this.style.visibility='hidden'"
                    >


                    <div class="tracking-content">

                        <span class="tracking-label">
                            Próxima ação
                        </span>


                        <strong class="tracking-success">
                            Acompanhamento
                        </strong>


                        <span class="tracking-detail">
                            Recomendado em 15/07/2026
                        </span>

                    </div>


                    <img
                        src="../imagens/seta.png"
                        alt=""
                        class="tracking-arrow"
                        onerror="this.style.visibility='hidden'"
                    >

                </button>


            </div>

        </section>



        <!-- =========================================
             AVISO GLOBAL
        ========================================== -->

        <section class="disclaimer-section">

            <div id="global-disclaimer"></div>

        </section>


    </main>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->


    <!--
        1 - AUTENTICAÇÃO

        Precisa carregar primeiro.
        O header e a tela usam getSessao().
    -->

    <script
        src="../componentes/auth.js"
    ></script>


    <!--
        2 - HEADER GLOBAL
    -->

    <script
        src="../componentes/header.js"
    ></script>


    <!--
        3 - JAVASCRIPT DA TELA
    -->

    <script
        src="inicio_logado.js"
    ></script>


    <!--
        4 - AVISO GLOBAL
    -->

    <script
        src="../componentes/disclaimer.js"
    ></script>


</body>

</html>
