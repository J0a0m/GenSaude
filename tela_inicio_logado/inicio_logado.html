<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Início | GenSaúde SUS</title>

    <link
        rel="stylesheet"
        href="inicio_logado.css"
    >
    <link rel="stylesheet" href="../componentes/header.css">
</head>

<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <div
    id="global-header"
    data-active="inicio"
    data-logged="true"
    data-name="João Silva"
    ></div>



    <!-- =========================================
         CONTEÚDO PRINCIPAL
    ========================================== -->

    <main class="main-content">


        <!-- =========================================
             SAUDAÇÃO
        ========================================== -->

        <section class="welcome-section">

            <h1>
                Olá,
                <span id="firstName">
                    João
                </span>

                <span class="wave">
                    👋
                </span>
            </h1>

            <p>
                Cuide hoje para prevenir problemas amanhã.
            </p>

        </section>



        <!-- =========================================
             AVALIAÇÃO PREVENTIVA
        ========================================== -->

        <section class="preventive-banner">

            <div class="preventive-content">

                <h2>
                    Avaliação Preventiva
                </h2>

                <p>
                    Descubra seus fatores de risco
                    <br>
                    com base no histórico familiar.
                </p>


                <button
                    type="button"
                    class="assessment-button"
                    id="assessmentButton"
                >

                    <img
                        src="COLOQUE_O_LINK_DO_ICONE_AVALIACAO_AQUI"
                        alt=""
                        class="assessment-icon"
                        onerror="this.style.visibility='hidden'"
                    >

                    <span>
                        Iniciar avaliação
                    </span>

                </button>

            </div>


            <!-- ILUSTRAÇÃO -->

            <div class="preventive-image-area">

                <img
                    src="COLOQUE_O_LINK_DA_ILUSTRACAO_PRINCIPAL_AQUI"
                    alt="Avaliação preventiva"
                    class="preventive-image"
                    onerror="this.style.visibility='hidden'"
                >

            </div>

        </section>



        <!-- =========================================
             ACESSO RÁPIDO
        ========================================== -->

        <section class="quick-access-section">

            <h2 class="section-title">
                Acesso rápido
            </h2>


            <div class="quick-access-grid">


                <!-- =================================
                     HISTÓRICO
                ================================== -->

                <button
                    type="button"
                    class="quick-card"
                    id="historyCard"
                >

                    <img
                        src="COLOQUE_O_LINK_DO_ICONE_HISTORICO_AQUI"
                        alt=""
                        class="quick-card-image"
                        onerror="this.style.visibility='hidden'"
                    >


                    <div class="quick-card-content">

                        <h3>
                            Meu Histórico
                            <br>
                            Familiar
                        </h3>

                        <p>
                            Veja e atualize seu
                            <br>
                            histórico familiar.
                        </p>

                    </div>


                    <img
                        src="COLOQUE_O_LINK_DA_SETA_HISTORICO_AQUI"
                        alt=""
                        class="arrow-icon"
                        onerror="this.style.visibility='hidden'"
                    >

                </button>



                <!-- =================================
                     UBS OU UPA
                ================================== -->

                <button
                    type="button"
                    class="quick-card"
                    id="ubsCard"
                >

                    <img
                        src="COLOQUE_O_LINK_DO_ICONE_UBS_UPA_AQUI"
                        alt=""
                        class="quick-card-image"
                        onerror="this.style.visibility='hidden'"
                    >


                    <div class="quick-card-content">

                        <h3>
                            UBS ou UPA?
                        </h3>

                        <p>
                            Saiba onde
                            <br>
                            procurar conforme
                            <br>
                            seu caso.
                        </p>

                    </div>


                    <img
                        src="COLOQUE_O_LINK_DA_SETA_UBS_AQUI"
                        alt=""
                        class="arrow-icon"
                        onerror="this.style.visibility='hidden'"
                    >

                </button>



                <!-- =================================
                     UNIDADES
                ================================== -->

                <button
                    type="button"
                    class="quick-card"
                    id="unitsCard"
                >

                    <img
                        src="COLOQUE_O_LINK_DO_ICONE_UNIDADES_AQUI"
                        alt=""
                        class="quick-card-image"
                        onerror="this.style.visibility='hidden'"
                    >


                    <div class="quick-card-content">

                        <h3>
                            Unidades
                            <br>
                            Próximas
                        </h3>

                        <p>
                            Encontre unidades
                            <br>
                            perto de você.
                        </p>

                    </div>


                    <img
                        src="COLOQUE_O_LINK_DA_SETA_UNIDADES_AQUI"
                        alt=""
                        class="arrow-icon"
                        onerror="this.style.visibility='hidden'"
                    >

                </button>



                <!-- =================================
                     EDUCAÇÃO
                ================================== -->

                <button
                    type="button"
                    class="quick-card"
                    id="educationCard"
                >

                    <img
                        src="COLOQUE_O_LINK_DO_ICONE_EDUCACAO_AQUI"
                        alt=""
                        class="quick-card-image"
                        onerror="this.style.visibility='hidden'"
                    >


                    <div class="quick-card-content">

                        <h3>
                            Educação em
                            <br>
                            Saúde
                        </h3>

                        <p>
                            Conteúdo para
                            <br>
                            cuidar melhor da
                            <br>
                            saúde.
                        </p>

                    </div>


                    <img
                        src="COLOQUE_O_LINK_DA_SETA_EDUCACAO_AQUI"
                        alt=""
                        class="arrow-icon"
                        onerror="this.style.visibility='hidden'"
                    >

                </button>

            </div>

        </section>



        <!-- =========================================
             ACOMPANHAMENTO
        ========================================== -->

        <section class="tracking-section">

            <h2 class="section-title">
                Seu acompanhamento
            </h2>


            <div class="tracking-grid">


                <!-- =================================
                     ÚLTIMA AVALIAÇÃO
                ================================== -->

                <button
                    type="button"
                    class="tracking-card"
                    id="lastAssessmentCard"
                >

                    <img
                        src="COLOQUE_O_LINK_DO_ICONE_ATENCAO_AQUI"
                        alt=""
                        class="tracking-image"
                        onerror="this.style.visibility='hidden'"
                    >


                    <div class="tracking-content">

                        <span class="tracking-label">
                            Última avaliação
                        </span>

                        <strong class="tracking-danger">
                            Atenção Recomendada
                        </strong>

                        <span class="tracking-detail">
                            Realizada em 15/04/2026
                        </span>

                    </div>


                    <img
                        src="COLOQUE_O_LINK_DA_SETA_AVALIACAO_AQUI"
                        alt=""
                        class="tracking-arrow"
                        onerror="this.style.visibility='hidden'"
                    >

                </button>



                <!-- =================================
                     UBS DE REFERÊNCIA
                ================================== -->

                <button
                    type="button"
                    class="tracking-card"
                    id="referenceUnitCard"
                >

                    <img
                        src="COLOQUE_O_LINK_DO_ICONE_UBS_REFERENCIA_AQUI"
                        alt=""
                        class="tracking-image"
                        onerror="this.style.visibility='hidden'"
                    >


                    <div class="tracking-content">

                        <span class="tracking-label">
                            UBS de referência
                        </span>

                        <strong class="tracking-primary">
                            UBS Jardim das Flores
                        </strong>

                        <span class="tracking-detail">
                            Rua das Flores, 320 - Jardim das Flores
                        </span>

                    </div>


                    <img
                        src="COLOQUE_O_LINK_DA_SETA_UBS_REFERENCIA_AQUI"
                        alt=""
                        class="tracking-arrow"
                        onerror="this.style.visibility='hidden'"
                    >

                </button>



                <!-- =================================
                     PRÓXIMA AÇÃO
                ================================== -->

                <button
                    type="button"
                    class="tracking-card"
                    id="nextActionCard"
                >

                    <img
                        src="COLOQUE_O_LINK_DO_ICONE_ACOMPANHAMENTO_AQUI"
                        alt=""
                        class="tracking-image"
                        onerror="this.style.visibility='hidden'"
                    >


                    <div class="tracking-content">

                        <span class="tracking-label">
                            Próxima ação
                        </span>

                        <strong class="tracking-success">
                            Acompanhamento
                        </strong>

                        <span class="tracking-detail">
                            Recomendado em 15/07/2026
                        </span>

                    </div>


                    <img
                        src="COLOQUE_O_LINK_DA_SETA_ACOMPANHAMENTO_AQUI"
                        alt=""
                        class="tracking-arrow"
                        onerror="this.style.visibility='hidden'"
                    >

                </button>

            </div>

        </section>



        <!-- =========================================
             AVISO
        ========================================== -->

        <section class="disclaimer-section">

            <div class="disclaimer-box">

                <div class="disclaimer-left">

                    <img
                        src="COLOQUE_O_LINK_DO_ICONE_AVISO_AQUI"
                        alt=""
                        class="disclaimer-icon"
                        onerror="this.style.visibility='hidden'"
                    >

                    <p>
                        O GenSaúde SUS orienta, mas não substitui avaliação profissional.
                    </p>

                </div>


                <img
                    src="COLOQUE_O_LINK_DO_ELEMENTO_DECORATIVO_AQUI"
                    alt=""
                    class="disclaimer-decoration"
                    onerror="this.style.visibility='hidden'"
                >

            </div>

        </section>

    </main>

    <script src="../componentes/auth.js"></script>
    <script src="inicio-logado.js"></script>
    <script src="../componentes/header.js"></script>
</body>

</html>
