<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Unidades próximas | GenSaúde SUS</title>

    <!-- MAPA LEAFLET -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- CSS DA TELA -->
    <link
        rel="stylesheet"
        href="unidades.css"
    >

    <!-- COMPONENTES GLOBAIS -->
    <link
        rel="stylesheet"
        href="../componentes/header.css"
    >

    <link
        rel="stylesheet"
        href="../componentes/disclaimer.css"
    >
</head>

<body>

    <!-- HEADER GLOBAL -->
    <div
        id="global-header"
        data-active="unidades"
    ></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="units-main">

        <div class="units-layout">

            <!-- PESQUISA E LISTA -->
            <section
                class="units-content"
                aria-labelledby="unitsPageTitle"
            >

                <header class="units-heading">

                    <h1 id="unitsPageTitle">
                        Encontre uma unidade
                        <br>
                        perto de você
                    </h1>

                    <p>
                        Busque UBS e UPA próximas do seu endereço.
                    </p>

                </header>

                <!-- PESQUISA -->
                <div class="search-and-filter-area">

                    <form
                        class="units-search-form"
                        id="unitsSearchForm"
                        role="search"
                    >

                        <label
                            class="sr-only"
                            for="unitsSearchInput"
                        >
                            Buscar unidade
                        </label>

                        <div class="search-input-area">

                            <svg
                                class="search-icon"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <circle
                                    cx="11"
                                    cy="11"
                                    r="7"
                                ></circle>

                                <path d="M16.5 16.5L21 21"></path>
                            </svg>

                            <input
                                type="search"
                                id="unitsSearchInput"
                                name="busca"
                                placeholder="Busque por bairro, cidade ou nome da unidade"
                                autocomplete="off"
                            >

                        </div>

                        <button
                            type="button"
                            class="filters-button"
                            id="filtersButton"
                            aria-expanded="false"
                            aria-controls="filtersPanel"
                        >

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <path d="M4 5H20L14 12V18L10 20V12L4 5Z"></path>
                            </svg>

                            <span>
                                Filtros
                            </span>

                        </button>

                    </form>

                    <!-- PAINEL DE FILTROS -->
                    <div
                        class="filters-panel"
                        id="filtersPanel"
                        hidden
                    >

                        <div class="filter-field">

                            <label for="distanceFilter">
                                Distância máxima
                            </label>

                            <select id="distanceFilter">

                                <option value="5">
                                    Até 5 km
                                </option>

                                <option value="10">
                                    Até 10 km
                                </option>

                                <option value="20" selected>
                                    Até 20 km
                                </option>

                                <option value="30">
                                    Até 30 km
                                </option>

                            </select>

                        </div>

                        <label class="open-units-filter">

                            <input
                                type="checkbox"
                                id="openUnitsOnly"
                            >

                            <span>
                                Mostrar somente unidades abertas
                            </span>

                        </label>

                    </div>

                </div>

                <!-- FILTROS POR TIPO -->
                <div
                    class="unit-type-filters"
                    role="group"
                    aria-label="Filtrar por tipo de unidade"
                >

                    <button
                        type="button"
                        class="unit-type-button unit-type-button-all active"
                        id="showAllUnitsButton"
                        data-unit-type="all"
                        aria-pressed="true"
                    >

                        <span class="type-button-symbol">
                            +
                        </span>

                        Todas

                    </button>

                    <button
                        type="button"
                        class="unit-type-button unit-type-button-ubs"
                        id="showUbsButton"
                        data-unit-type="ubs"
                        aria-pressed="false"
                    >

                        <img
                            src="../imagens/ubs.png"
                            alt=""
                            aria-hidden="true"
                        >

                        UBS

                    </button>

                    <button
                        type="button"
                        class="unit-type-button unit-type-button-upa"
                        id="showUpaButton"
                        data-unit-type="upa"
                        aria-pressed="false"
                    >

                        <span class="type-button-symbol">
                            +
                        </span>

                        UPA

                    </button>

                </div>

                <!-- QUANTIDADE ENCONTRADA -->
                <p
                    class="units-result-count"
                    id="unitsResultCount"
                    aria-live="polite"
                >
                    Buscando unidades próximas...
                </p>

                <!-- LISTA DE UNIDADES -->
                <div
                    class="units-list"
                    id="unitsList"
                    aria-live="polite"
                    aria-busy="true"
                >

                    <div class="units-loading-state">

                        <span
                            class="units-loader"
                            aria-hidden="true"
                        ></span>

                        <p>
                            Localizando UBS e UPA próximas do seu endereço...
                        </p>

                    </div>

                </div>

            </section>

            <!-- MAPA -->
            <aside
                class="units-map-column"
                aria-label="Mapa das unidades próximas"
            >

                <div class="map-card">

                    <div
                        id="unitsMap"
                        class="units-map"
                        role="application"
                        aria-label="Mapa com UBS e UPA próximas"
                    ></div>

                    <div
                        class="map-message"
                        id="mapMessage"
                        role="status"
                        aria-live="polite"
                        hidden
                    >

                        <span
                            class="map-message-loader"
                            aria-hidden="true"
                        ></span>

                        <span id="mapMessageText">
                            Carregando mapa...
                        </span>

                    </div>

                </div>

                <!-- ENDEREÇO SALVO -->
                <button
                    type="button"
                    class="saved-address-card"
                    id="useSavedAddressButton"
                >

                    <span
                        class="saved-address-icon"
                        aria-hidden="true"
                    >

                        <img
                            src="../imagens/localizacao.png"
                            alt=""
                        >

                    </span>

                    <span class="saved-address-content">

                        <strong>
                            Usar meu endereço salvo
                        </strong>

                        <span id="savedAddressText">
                            Localize unidades usando os dados da avaliação.
                        </span>

                    </span>

                </button>

            </aside>

        </div>

        <!-- AVISO GLOBAL -->
        <div id="global-disclaimer"></div>

    </main>

    <!-- MODELO DO CARD DE UNIDADE -->
    <template id="unitCardTemplate">

        <article class="unit-card">

            <div
                class="unit-card-icon"
                aria-hidden="true"
            >

                <img
                    class="unit-card-icon-image"
                    src="../imagens/ubs.png"
                    alt=""
                >

                <span class="unit-card-plus">
                    +
                </span>

            </div>

            <div class="unit-card-content">

                <div class="unit-card-heading">

                    <h2 class="unit-card-name"></h2>

                    <span class="unit-card-status"></span>

                </div>

                <p class="unit-card-information unit-card-address">

                    <img
                        src="../imagens/localizacao.png"
                        alt=""
                        aria-hidden="true"
                    >

                    <span></span>

                </p>

                <p class="unit-card-information unit-card-hours">

                    <span
                        class="clock-icon"
                        aria-hidden="true"
                    ></span>

                    <span></span>

                </p>

                <div class="unit-card-footer">

                    <span class="unit-card-distance"></span>

                    <a
                        class="unit-details-link"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Ver detalhes
                        <span aria-hidden="true">›</span>
                    </a>

                </div>

            </div>

        </article>

    </template>

    <!-- AUTENTICAÇÃO -->
    <script src="../componentes/auth.js"></script>

    <!-- HEADER GLOBAL -->
    <script src="../componentes/header.js"></script>

    <!-- AVISO GLOBAL -->
    <script src="../componentes/disclaimer.js"></script>

    <!-- MAPA LEAFLET -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- JAVASCRIPT DA TELA -->
    <script src="unidades.js"></script>

</body>

</html>
