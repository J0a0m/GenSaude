        <div class="menu">

            Entrar

    </nav>


</header>








<main class="login-page">






<section class="login-card card">






<h1 class="login-title">

    Entrar

</h1>






<p class="login-description">

    Acesse sua conta para acompanhar sua saúde e prevenção.

</p>








<form id="form-login">






<div class="login-fields">






<div class="input-wrapper">


<img 
src="../../assets/icones/email.png"
alt="E-mail"
class="input-icon">



<input 
id="email"
type="text"
class="input-control"
placeholder="E-mail ou CPF"
required>



</div>








<div class="input-wrapper">



<img 
src="../../assets/icones/password.png"
alt="Senha"
class="input-icon">






<input 
id="senha"
type="password"
class="input-control"
placeholder="Senha"
required>





<img

id="olho"

src="../../assets/icones/olho-fechado.png"

alt="Mostrar senha"

class="input-action"

>



</div>







</div>








<div class="login-options">



<label class="checkbox-line">


<input type="checkbox">


<span>

Lembrar de mim

</span>


</label>







<a href="#" class="forgot-password">

Esqueci minha senha

</a>





</div>







<button 
type="submit"
class="btn-primary">


Entrar


</button>







</form>









<div class="login-divider">


<span></span>


<p>

ou

</p>


<span></span>



</div>








<button 

class="btn-secondary"

onclick="irPara('../cadastro/cadastro.html')">


Criar conta


</button>







</section>









<section class="login-illustration">



<img

src="../../assets/imagens/login-ilustracao.png"

alt="Ilustração de login"

>



</section>








</main>
